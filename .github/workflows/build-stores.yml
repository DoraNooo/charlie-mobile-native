name: Build Mobile Stores (Android & iOS)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Optional numeric version code override (Android versionCode & iOS CFBundleVersion)"
        required: false
        type: string
        default: ""

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"
  GODOT_TEMPLATES_DIR_NAME: "4.3.stable"

jobs:
  validate:
    name: Validate Godot 4.3 Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot 4.3 Linux binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-linux-${{ env.GODOT_RELEASE }}

      - name: Download Godot 4.3-stable (Linux)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" ~/.local/bin/godot
          chmod +x ~/.local/bin/godot

      - name: Import project & verify zero script/parse errors
        run: |
          set -o pipefail
          ~/.local/bin/godot --headless --path . --import 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed loading resource:" godot-import.log; then
            echo "::error::Godot reported script or parse errors during headless import."
            exit 1
          fi
          echo "Godot headless import completed with zero script/parse errors."

  build-android:
    name: Build Android (APK & AAB)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components (API 35)
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "${SDKMANAGER}" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Cache Godot 4.3 Linux binary & export templates
        id: cache-godot-android
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR_NAME }}
          key: godot-linux-templates-${{ env.GODOT_RELEASE }}

      - name: Download Godot 4.3-stable & export templates
        if: steps.cache-godot-android.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin ~/.local/share/godot/export_templates/"${GODOT_TEMPLATES_DIR_NAME}" /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" ~/.local/bin/godot
          chmod +x ~/.local/bin/godot

          curl -fsSL -o /tmp/godot/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -o /tmp/godot/templates.tpz -d /tmp/godot/templates
          mv /tmp/godot/templates/templates/* ~/.local/share/godot/export_templates/"${GODOT_TEMPLATES_DIR_NAME}"/

      - name: Install Android Gradle build template
        run: |
          mkdir -p android/build
          unzip -oq ~/.local/share/godot/export_templates/"${GODOT_TEMPLATES_DIR_NAME}"/android_source.zip -d android/build
          touch android/build/.gdignore

      - name: Configure Godot Android SDK & keystores
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          mkdir -p ~/.config/godot /tmp/keystores build/android

          # Generate debug keystore for debug APK and unsigned CI verification fallback
          keytool -genkeypair -v \
            -keystore /tmp/keystores/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "/tmp/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          # Optional version_code override
          if [ -n "${INPUT_VERSION_CODE}" ]; then
            sed -i "s|^version/code=.*|version/code=${INPUT_VERSION_CODE}|g" export_presets.cfg
          fi

          # Configure release keystore if secrets are present, otherwise fall back to debug keystore
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "Configuring release signing keystore from GitHub Secrets..."
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > /tmp/keystores/release.keystore
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("export_presets.cfg")
          text = p.read_text()
          text = text.replace('keystore/release=""', 'keystore/release="/tmp/keystores/release.keystore"')
          text = text.replace('keystore/release_user=""', f'keystore/release_user="{os.environ["ANDROID_KEY_ALIAS"]}"')
          key_pass = os.environ.get("ANDROID_KEY_PASSWORD") or os.environ["ANDROID_KEYSTORE_PASSWORD"]
          text = text.replace('keystore/release_password=""', f'keystore/release_password="{key_pass}"')
          p.write_text(text)
          PY
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "Release keystore secrets not set; using debug keystore fallback for AAB CI verification."
            python3 - <<'PY'
          import pathlib
          p = pathlib.Path("export_presets.cfg")
          text = p.read_text()
          text = text.replace('keystore/release=""', 'keystore/release="/tmp/keystores/debug.keystore"')
          text = text.replace('keystore/release_user=""', 'keystore/release_user="androiddebugkey"')
          text = text.replace('keystore/release_password=""', 'keystore/release_password="android"')
          p.write_text(text)
          PY
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Import project resources
        run: ~/.local/bin/godot --headless --path . --import

      - name: Export Android APK (Test Direct)
        run: |
          ~/.local/bin/godot --headless --path . --export-debug "Android (APK - Test Direct)" build/android/charlie-debug.apk
          ls -lh build/android/charlie-debug.apk

      - name: Export Android AAB (Google Play)
        run: |
          ~/.local/bin/godot --headless --path . --export-release "Android (AAB - Google Play)" build/android/charlie-release.aab
          ls -lh build/android/charlie-release.aab

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: charlie-android-apk
          path: build/android/charlie-debug.apk
          if-no-files-found: error

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: charlie-android-aab
          path: build/android/charlie-release.aab
          if-no-files-found: error

  build-ios:
    name: Build iOS (Xcode Project & Archive / IPA)
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot 4.3 macOS binary & export templates
        id: cache-godot-ios
        uses: actions/cache@v4
        with:
          path: |
            ~/Applications/Godot.app
            ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_TEMPLATES_DIR_NAME }}
          key: godot-macos-templates-${{ env.GODOT_RELEASE }}

      - name: Download Godot 4.3-stable (macOS) & export templates
        if: steps.cache-godot-ios.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/Applications ~/Library/Application\ Support/Godot/export_templates/"${GODOT_TEMPLATES_DIR_NAME}" /tmp/godot
          curl -fsSL -o /tmp/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_macos.universal.zip"
          unzip -oq /tmp/godot/godot.zip -d ~/Applications

          curl -fsSL -o /tmp/godot/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -oq /tmp/godot/templates.tpz -d /tmp/godot/templates
          mv /tmp/godot/templates/templates/* ~/Library/Application\ Support/Godot/export_templates/"${GODOT_TEMPLATES_DIR_NAME}"/

      - name: Prepare iOS export configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          mkdir -p build/ios
          if [ -n "${INPUT_VERSION_CODE}" ]; then
            sed -i '' "s|^application/version=.*|application/version=\"${INPUT_VERSION_CODE}\"|g" export_presets.cfg
          fi

          if [ -n "${APPLE_TEAM_ID}" ]; then
            sed -i '' "s|^application/app_store_team_id=.*|application/app_store_team_id=\"${APPLE_TEAM_ID}\"|g" export_presets.cfg
            echo "IOS_SIGNED=true" >> "$GITHUB_ENV"
          else
            # Provide a placeholder team ID only so Godot generates the Xcode project cleanly;
            # xcodebuild will run unsigned archive verification below.
            sed -i '' 's|^application/app_store_team_id=.*|application/app_store_team_id="UNSIGNEDCI"|g' export_presets.cfg
            echo "IOS_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Import project resources
        run: ~/Applications/Godot.app/Contents/MacOS/Godot --headless --path . --import

      - name: Export iOS Xcode project
        run: |
          ~/Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS (App Store)" build/ios/charlie.xcodeproj
          ls -la build/ios

      - name: Build / Archive via xcodebuild (unsigned CI verification)
        if: env.IOS_SIGNED != 'true'
        run: |
          xcodebuild archive \
            -project build/ios/charlie.xcodeproj \
            -scheme charlie \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/charlie.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          (cd build/ios && zip -qr charlie-ios-xcode-project.zip charlie.xcodeproj charlie charlie.pck charlie.xcarchive 2>/dev/null || zip -qr charlie-ios-xcode-project.zip .)
          ls -lh build/ios/charlie-ios-xcode-project.zip

      - name: Sign & Export IPA via xcodebuild (when Apple secrets configured)
        if: env.IOS_SIGNED == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "${APPLE_CERTIFICATE_BASE64}" ] && [ -n "${APPLE_PROVISIONING_PROFILE_BASE64}" ]; then
            KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
            KEYCHAIN_PASS="ci-temp-keychain"
            security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
            security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"

            echo "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
            security import "${RUNNER_TEMP}/cert.p12" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
            security list-keychain -d user -s "${KEYCHAIN_PATH}"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "${APPLE_PROVISIONING_PROFILE_BASE64}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/ci_profile.mobileprovision
          fi

          xcodebuild archive \
            -project build/ios/charlie.xcodeproj \
            -scheme charlie \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/charlie.xcarchive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"

          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/charlie.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist"
          ls -lh build/ios/ipa

      - name: Upload iOS Xcode project artifact (unsigned)
        if: env.IOS_SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: charlie-ios-xcode-project
          path: build/ios/charlie-ios-xcode-project.zip
          if-no-files-found: error

      - name: Upload iOS IPA artifact (signed)
        if: env.IOS_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: charlie-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
